function formatDate(dateInput) {
  if (!dateInput) return "";
  const d = new Date(dateInput);
  if (isNaN(d.getTime())) return String(dateInput);
  return d.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
}

function buildReportDataFromAssessment(input) {
  if (!input) return sampleData;

  if (input.top5Careers && Array.isArray(input.top5Careers) && input.top5Careers.length > 0 && input.executiveSummary) {
    return {
      studentName: input.studentName || input.student?.name || "Student",
      classGrade: input.classGrade || (input.student?.grade ? "Grade " + input.student.grade : "Grade 10"),
      schoolName: input.schoolName || input.student?.school || "",
      testDate: input.testDate || (input.student?.assessmentDate ? formatDate(input.student.assessmentDate) : formatDate(new Date())),
      scores: input.scores || sampleData.scores,
      triProfile: input.triProfile || sampleData.triProfile,
      executiveSummary: input.executiveSummary || sampleData.executiveSummary,
      developmentPriorities: input.developmentPriorities || sampleData.developmentPriorities,
      top5Careers: input.top5Careers,
      goodFitCareers: input.goodFitCareers || sampleData.goodFitCareers,
      actionPlan: input.actionPlan || sampleData.actionPlan
    };
  }

  const studentName = input.studentName || input.student?.name || input.userName || "Student";
  const rawGrade = input.classGrade || input.student?.grade || input.userClass || "10";
  const classGrade = String(rawGrade).toLowerCase().includes("grade") ? rawGrade : `Grade ${rawGrade}`;
  const schoolName = input.schoolName || input.student?.school || input.userSchool || "";
  const testDate = input.testDate || (input.student?.assessmentDate ? formatDate(input.student.assessmentDate) : formatDate(new Date()));

  const rawScores = input.scores || {};
  const normalizedPct = {};
  const normalized1to5 = {};

  const allParams = [
    "Administrative", "Numerical", "Logical", "Mechanical", "Verbal",
    "Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional",
    "Empathy", "Emotional Intelligence", "Engagement", "Exploration", "Extraversion"
  ];

  const getRawVal = (p) => {
    const kUnderscore = p.replace(/ /g, "_");
    const sources = [
      rawScores[p],
      rawScores[kUnderscore],
      rawScores.skills?.[p],
      rawScores.skills?.[kUnderscore],
      rawScores.passion?.[p],
      rawScores.passion?.[kUnderscore],
      rawScores.individuality?.[p],
      rawScores.individuality?.[kUnderscore],
      input[p],
      input[kUnderscore]
    ];
    for (const src of sources) {
      if (src !== undefined && src !== null) return src;
    }
    return undefined;
  };

  allParams.forEach(p => {
    let raw = getRawVal(p);
    let pct = 0;
    if (typeof raw === 'object' && raw !== null && raw.score !== undefined) {
      const maxVal = raw.max || 5;
      pct = Math.round((raw.score / maxVal) * 100);
    } else if (typeof raw === 'number') {
      if (raw <= 5 && raw > 0) {
        pct = Math.round((raw / 5) * 100);
      } else {
        pct = Math.min(100, Math.max(0, Math.round(raw)));
      }
    }
    normalizedPct[p] = pct;
    normalized1to5[p] = Math.max(1, Math.min(5, Math.round((pct / 100) * 5)));
  });

  const skillsList = ["Administrative", "Numerical", "Logical", "Mechanical", "Verbal"];
  const riasecList = ["Realistic", "Investigative", "Artistic", "Social", "Enterprising", "Conventional"];
  const traitsList = ["Empathy", "Emotional Intelligence", "Engagement", "Exploration", "Extraversion"];

  const avgPct = (arr) => Math.round(arr.reduce((sum, k) => sum + (normalizedPct[k] || 0), 0) / arr.length);
  const maxPct = (arr) => Math.max(...arr.map(k => normalizedPct[k] || 0));

  const topInterestScore = maxPct(riasecList);

  const triProfile = input.triProfile || {

  const rankedCareers = careerMaster.map(c => {

    let weightedScoreSum = 0;
    Object.entries(c.weights).forEach(([param, weight]) => {
      sumWeight += weight;
      const paramScore = normalizedPct[param] !== undefined ? normalizedPct[param] : 50;
      weightedScoreSum += paramScore * weight;
    });
    const rawScore = sumWeight > 0 ? weightedScoreSum / sumWeight : 65;
    const finalScore = Math.min(96, Math.max(60, Math.round(rawScore)));
    
    const sortedParams = Object.keys(c.weights).sort((a, b) => (normalizedPct[b] || 0) - (normalizedPct[a] || 0));
    const topP1 = sortedParams[0] || "Logical";
    const topP2 = sortedParams[1] || "Numerical";
    const whyGoodFit = `Strong match for ${topP1} (${normalized1to5[topP1]}/5) and ${topP2} (${normalized1to5[topP2]}/5) skills, aligning with student's profile strengths.`;

    return {
      title: c.title,
      cluster: c.cluster,
      score: finalScore,
      requirements: c.requirements,
      whyGoodFit,
      salary: c.salary,
      investment: c.investment,
      roadmap: c.roadmap,
      institutions: c.institutions
    };
  });

  rankedCareers.sort((a, b) => b.score - a.score);

  const top5Careers = input.top5Careers && input.top5Careers.length > 0 ? input.top5Careers : rankedCareers.slice(0, 5);
  
  let goodFitCareers;
  if (input.goodFitCareers && input.goodFitCareers.length > 0) {

  } else {
    const rawGoodFit = rankedCareers.slice(5, 10);
    const lastTop5Score = top5Careers[4]?.score || 80;
    goodFitCareers = rawGoodFit.map((c, idx) => {
      let score = c.score;
      if (score >= lastTop5Score) {
        score = Math.max(65, lastTop5Score - (idx + 1) * 2);
      }
      return {
        title: c.title,
        cluster: c.cluster,
        score: score
      };
    });
    for (let i = 0; i < goodFitCareers.length; i++) {
      if (i > 0 && goodFitCareers[i].score >= goodFitCareers[i - 1].score) {
        goodFitCareers[i].score = Math.max(60, goodFitCareers[i - 1].score - 2);

function loadDemo() {
  document.getElementById('jsonBox').value = JSON.stringify(sampleData, null, 2);
  renderReport(sampleData);
}

function generateFromBox() {
  try {
    const raw = JSON.parse(document.getElementById('jsonBox').value);
    const data = buildReportDataFromAssessment(raw);
    document.getElementById('jsonBox').value = JSON.stringify(data, null, 2);
    renderReport(data);
  } catch (e) {
    alert("Invalid JSON data provided: " + e.message);
  }
}

function toggleJSON() {
  const box = document.getElementById('jsonBox');
  box.style.display = box.style.display === 'none' || box.style.display === '' ? 'block' : 'none';
}

window.addEventListener("message", function(event) {
  if (!event.data) return;
  const payload = event.data.payload || event.data;
  if (payload && (payload.scores || payload.student || payload.studentName || payload.top5Careers)) {
    const formattedData = buildReportDataFromAssessment(payload);
    const box = document.getElementById('jsonBox');
    if (box) box.value = JSON.stringify(formattedData, null, 2);
    renderReport(formattedData);
  }
});

window.MentorMeCareerReport = {
  renderReport,
  buildReportDataFromAssessment,
  sampleData
};

window.generateReport = function(data) {
  const formattedData = buildReportDataFromAssessment(data);
  const box = document.getElementById('jsonBox');
  if (box) box.value = JSON.stringify(formattedData, null, 2);
  renderReport(formattedData);
};
