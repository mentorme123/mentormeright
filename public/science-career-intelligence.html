 return a.status!=='complete'||Number.isFinite(a.completed);

 content+=reportSection(3,'Why these careers appeared',`<p>The explanations below connect the career model to your actual responses. No aptitude, interest or trait score alone determines a recommendation.</p>${r.top.map((c,i)=>{let ev=careerEvidence(c,a);let challenge=ev.apt.filter(x=>x.value<60).slice(-1)[0];return `<article class="career evidence-card"><div class="career-heading"><span class="tag">OPTION ${i+1}</span><h3>${esc(c.name)}</h3></div><p><b>Work focus:</b> ${esc(c.work)}.</p><div class="evidence-lines"><p><b>Reasoning evidence:</b> ${ev.apt.slice(0,2).map(x=>`${esc(labelDim(x))} ${fmtIndex(x.value)}/100`).join('; ')}.</p><p><b>Interest evidence:</b> ${ev.interest.map(x=>`${esc(x.dim)} — ${x.chosen} choices in ${x.exposures} answered appearances; direct rating index ${fmtIndex(x.directValue)}`).join('; ')}.</p><p><b>Workstyle evidence:</b> ${ev.trait.map(x=>`${esc(x.dim)} ${fmtIndex(x.value)}/100`).join('; ')}.</p></div><p><b>What to test next:</b> ${challenge?`Practise ${esc(labelDim(challenge))} and see whether you enjoy improving at it.`:`Test whether the daily activities described above remain interesting during a real project or practitioner conversation.`}</p></article>`}).join('')}`);
 content+=reportSection(4,'Your subject and pathway checks',`<div class="note"><b>Recorded subjects:</b> ${esc(a.student.stream)} · ${esc(a.student.board)} · English: ${esc(a.student.english||'Not recorded')}.</div><p>${r.excludedCount} career profiles were excluded before ranking. There is no automatic shared-category access to interdisciplinary careers. PCM excludes biology-led options in this version; PCB excludes maths-led engineering and computing routes.</p><div class="tablewrap"><table><thead><tr><th>Career</th><th>Degree route to investigate</th><th>Status</th></tr></thead><tbody>${r.top.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.degree)}</td><td>Stream matched<br><small>Course admission checks pending</small></td></tr>`).join('')}</tbody></table></div><p>Subject mapping is a conservative exploration rule, not confirmation that a particular college will accept the student. Verify exact subjects, qualifying marks, entrance requirements, passing year and any additional-subject conditions for the intended admission cycle.</p>`);
 content+=reportSection(5,'Career deep dives and academic roadmaps',`${r.top.map((c,i)=>{let g=FAMILY_GUIDE[c.family];return `<article class="career roadmap-card"><span class="tag">PATHWAY ${i+1}</span><h3>${esc(c.name)}</h3><p class="lead">${esc(c.work)}.</p><p><b>Possible work settings:</b> ${esc(g.setting)}</p><dl class="roadmap"><div><dt>School preparation</dt><dd>${esc(g.prepare)}</dd></div><div><dt>Undergraduate route</dt><dd>${esc(c.degree)}. Verify prerequisites for the actual program.</dd></div><div><dt>Entry and selection</dt><dd>Identify the specific program’s current admission notice. Distinguish entrance exams, counselling and institution selection from later employer recruitment.</dd></div><div><dt>Advanced study</dt><dd>${esc(g.advanced)}</dd></div><div><dt>Try the work</dt><dd>${esc(g.experience)}</dd></div></dl></article>`}).join('')}<p class="small">These are planning routes. Requirements for regulated practice and professional recognition must be checked with the relevant official body.</p>`);
 }
 let rows=Array.isArray(plan.institutions)?plan.institutions.slice(0,3):[];
 content+=reportSection(6,'Build an institution shortlist',`<p>Compare exact programs, not just college names. A famous institution is useful only if it offers the relevant program and its entry requirements fit your situation.</p><div class="tablewrap"><table><thead><tr><th>Institution and program</th><th>Official source</th><th>Next verification</th></tr></thead><tbody>${rows.some(x=>x.name||x.program)?rows.filter(x=>x.name||x.program).map(x=>`<tr><td><b>${esc(x.name)}</b><br>${esc(x.program)}</td><td>${safeLink(x.url)?`<a href="${esc(safeLink(x.url))}" target="_blank" rel="noopener">Official page supplied</a>`:'Not recorded'}</td><td>${esc(x.note||'Confirm subjects, entry route, fees and dates.')}</td></tr>`).join(''):'<tr><td colspan="3">No programs recorded yet. Add up to three researched options in the planning panel below the report.</td></tr>'}</tbody></table></div><p class="small">Entries above are student/counsellor research notes, not independently verified MentorMe recommendations. A supplied link is not a verification badge.</p><h3>Useful official starting points</h3><p><a href="https://jeemain.nta.nic.in/" target="_blank" rel="noopener">JEE Main</a> · <a href="https://neet.nta.nic.in/" target="_blank" rel="noopener">NEET</a> · <a href="https://www.iiseradmission.in/" target="_blank" rel="noopener">IISER Admissions</a>. Use the relevant institution’s current prospectus for final course-level checks.</p><p>Compare teaching and laboratory access, curriculum, recognition where relevant, student support, total cost and transparent outcome evidence. Do not label institutions “strong fit” based on name matching alone.</p>`);
 content+=reportSection(7,'Education investment and career economics',`<p>Build a budget for one shortlisted education route. Keep course costs separate from later earnings; a career alignment index does not establish a financial return.</p><h3>${esc(plan.budgetCareer||familyPrimary?.name||'Selected pathway')} — family planning estimate</h3>${budget?`<div class="tablewrap"><table><thead><tr><th>Planning item</th><th>Assumption or calculation</th><th>Amount</th></tr></thead><tbody><tr><td>Tuition</td><td>${fmtMoney(budget.annualTuition)} × ${budget.years} years</td><td>${fmtMoney(budget.annualTuition*budget.years)}</td></tr><tr><td>Living and travel</td><td>${fmtMoney(budget.annualLiving)} × ${budget.years} years</td><td>${fmtMoney(budget.annualLiving*budget.years)}</td></tr><tr><td>One-off costs</td><td>Applications, equipment and other entered costs</td><td>${fmtMoney(budget.oneOff)}</td></tr><tr><td>Gross estimate</td><td>Tuition + living + one-off costs</td><td>${fmtMoney(budget.gross)}</td></tr><tr><td>Confirmed aid entered</td><td>Deduct once across the whole course</td><td>${fmtMoney(budget.aid)}</td></tr><tr><td>Net planned cost</td><td>Gross less aid, floored at zero</td><td><b>${fmtMoney(budget.net)}</b></td></tr></tbody></table></div>${budget.excessAid?'<p class="note">Aid exceeds the gross estimate. Check the entries; the displayed net is floored at zero.</p>':''}<p class="small">Family-entered assumptions; not a college fee quote. No inflation, financing interest, foreign exchange changes or earnings are included. Revisit the estimate when official fees are available.</p>`:'<p class="note">No complete budget has been entered. The planning panel below lets you add annual tuition, course duration, living costs, one-off costs and confirmed aid. Zero and unknown are kept distinct.</p>'}<p><b>Budget source or notes:</b> ${esc(plan.costNote||'Not recorded.')}</p><h3>Research earnings before drawing conclusions</h3><p>For each role, record geography, experience level, source date, sample size where available, and whether compensation is fixed or includes variable pay. Distinguish placement offers from realised career earnings. No unsourced salary range or payback period is generated here.</p>`);
 content+=reportSection(8,'Your next 90 days',`<div class="tablewrap"><table><thead><tr><th>When</th><th>Action</th><th>Owner and evidence</th></tr></thead><tbody><tr><td>Days 1–30</td><td>${complete?`Compare two programs linked to ${esc(r.top[0].name)} and a second shortlisted career.`:'Arrange a fresh guided assessment and gather teacher observations.'}</td><td>Student + counsellor<br>Two official course pages and a short comparison</td></tr><tr><td>Days 31–60</td><td>${weak.length?esc(DEVELOPMENT[weak[0].dim]):'Complete a safe project connected to a leading career and record what you enjoyed.'}</td><td>Student + mentor<br>One project log and reflection</td></tr><tr><td>Days 61–90</td><td>Discuss the work with a practitioner, compare verified education costs, and review the shortlist with family.</td><td>Student + parent/counsellor<br>Updated shortlist with reasons</td></tr></tbody></table></div><h3>Parent–student discussion</h3><ol><li>Which daily activities attract you, even without a prestigious career title?</li><li>Which strengths have evidence beyond this assessment?</li><li>Which assumptions about the top careers changed after research?</li><li>What trade-offs in location, cost and duration are manageable?</li><li>What would make you revise the shortlist?</li></ol><h3>If considering study abroad</h3><p>Compare exact program prerequisites, language requirements, total costs, funding and recognition of the qualification for the intended work location. Investigate these separately for each destination; this report does not assess visa eligibility or professional recognition abroad.</p>`);
 content+=reportSection(9,'Counsellor review and next decision',`<p><b>Current aspiration:</b> ${esc(a.student.aspiration||'Not provided.')}</p><p><b>Review note:</b> ${esc(a.reviewNote||'Not yet reviewed. Use the note field below after discussing this report.')}</p><p class="small">${a.reviewedAt?'Note saved '+new Date(a.reviewedAt).toLocaleString('en-IN'):'No review date recorded.'} Local notes are not authenticated professional signatures.</p><p>Before narrowing the shortlist, bring academic marks, teacher feedback, practical work and the student’s own preferences into the discussion. Interest and workstyle can change with exposure. Keep a record of why options were retained or set aside.</p>`);
 content+=reportSection(10,'Methodology and interpretation',`<p>This is an educational career-exploration pilot, not a diagnostic assessment, validated psychometric certification, admissions decision or employment guarantee.</p><ul><li><b>Form:</b> 90 questions selected from 180 eligible items per stream, drawn from ${BANK.length} shared and stream-specific bank items.</li><li><b>Reasoning:</b> 45 questions; nine dimensions; five items per dimension. Unanswered items earn no credit.</li><li><b>Interest:</b> 18 scenarios plus 12 direct ratings. Six dimensions have equal offered exposure. Each interest index combines 60% relative scenario choice rate and 40% direct rating index. Choice rates are not absolute measures of liking.</li><li><b>Workstyle:</b> 15 self-report items; three per trait. Results indicate reported frequency, not proven competence.</li><li><b>Career alignment:</b> 45% reasoning, 35% interests and 20% workstyle, with provisional relevance weights. The subject shortlist is applied before ranking.</li><li><b>Quality limits:</b> A small number of items per dimension limits precision. Item difficulty bands, relevance weights, cross-stream substitutions and thresholds need pilot validation. Results are not comparable population percentiles.</li></ul><p>Course information, entrance processes, fees, professional requirements and employment conditions can change. Verify current official sources before decisions or applications. MentorMe does not guarantee any career, admission, academic or employment outcome.</p><p class="small">Scoring version: ${esc(a.modelVersion)} · Report edition: ${REPORT_EDITION} · Attempt ID: ${esc(a.id)}. This report update changes presentation and planning features, not assessment scoring.</p>`);
 shell(`<div class="actions no-print"><button data-action="dashboard">← Local dashboard</button><button class="primary" data-action="print">Print / save PDF</button><button data-action="exportone">Export this record</button></div><div class="report enhanced-report">${content}</div>${reportEditor(a)}`);
}
function reportEditor(a){const p=a.reportPlan||{},rows=Array.isArray(p.institutions)?p.institutions:[];const input=(name,label,extra='')=>`<label>${label}<input id="plan-${name}" type="number" min="0" max="1000000000" step="any" value="${esc(p[name]??'')}" ${extra}></label>`;return `<section class="panel no-print report-editor"><h2>Personalise this report</h2><p>Optional planning fields. Save changes before printing or exporting. These notes stay in the same local record.</p><h3>Education budget</h3><label>Pathway or program<input id="plan-budgetCareer" maxlength="180" value="${esc(p.budgetCareer||a.result.top[0]?.name||'')}"></label><div class="grid three">${input('annualTuition','Annual tuition (INR)')}${input('years','Course years')}${input('annualLiving','Annual living and travel (INR)')}${input('oneOff','One-off costs (INR)')}${input('aid','Confirmed aid for whole course (INR)')}</div><label>Cost source, date or notes<textarea id="plan-costNote" maxlength="1500" rows="2">${esc(p.costNote||'')}</textarea></label><h3>Three researched program options</h3>${[0,1,2].map(i=>{let x=rows[i]||{};return `<fieldset><legend>Option ${i+1}</legend><div class="grid two"><label>Institution<input id="inst-${i}-name" maxlength="180" value="${esc(x.name||'')}"></label><label>Exact program<input id="inst-${i}-program" maxlength="200" value="${esc(x.program||'')}"></label><label>Official HTTPS URL<input id="inst-${i}-url" type="url" maxlength="1000" value="${esc(x.url||'')}"></label><label>Source date and outstanding checks<input id="inst-${i}-note" maxlength="400" value="${esc(x.note||'')}"></label></div></fieldset>`}).join('')}<label>Counsellor note<textarea id="reviewNote" maxlength="3000" rows="4">${esc(a.reviewNote||'')}</textarea></label><div id="planError" role="alert"></div><button class="primary" data-action="saveplan">Save planning details and update report</button></section>`}
function saveReportPlan(){let a=records.find(x=>x.id===reportId);if(!a)return;let p={};for(let k of ['budgetCareer','annualTuition','years','annualLiving','oneOff','aid','costNote'])p[k]=$('plan-'+k).value.trim();let errors=[];for(let k of ['annualTuition','years','annualLiving','oneOff','aid'])if(p[k]!==''&&(!Number.isFinite(Number(p[k]))||Number(p[k])<0||Number(p[k])>1e9))errors.push('Use valid non-negative amounts for budget fields.');if(p.years!==''&&(Number(p.years)<=0||Number(p.years)>15))errors.push('Course duration must be greater than zero and at most 15 years.');p.institutions=[0,1,2].map(i=>{let x={};for(let k of ['name','program','url','note'])x[k]=$('inst-'+i+'-'+k).value.trim();if(x.url&&!safeLink(x.url))errors.push('Institution links must be valid HTTPS URLs.');return x});if(errors.length){$('planError').innerHTML='<div class="alert">'+[...new Set(errors)].map(esc).join('<br>')+'</div>';return}a.reportPlan=p;a.reviewNote=$('reviewNote').value.trim();a.reviewedAt=Date.now();persist();report(reportId);window.scrollTo(0,0)}

function dashboard(){stopTimer();view='dashboard';let done=records.filter(x=>x.status==='complete');shell(`<section class="intro"><span class="eyebrow">LOCAL FACILITATOR WORKSPACE</span><h1>Progress and reports</h1><p>Records on this browser only. This is not a secure school or administrator login.</p></section><div class="grid three stats"><article><b>${records.length}</b><span>Attempts</span></article><article><b>${done.length}</b><span>Completed</span></article><article><b>${records.length-done.length}</b><span>In progress</span></article></div><div class="actions"><button class="primary" data-action="intake">New student assessment</button><button data-action="backup">Export all records</button><label class="button">Restore backup<input id="restoreFile" type="file" accept="application/json,.json" hidden></label></div><div class="grid three"><label>Stream<select id="filterStream"><option value="">All streams</option><option>PCB</option><option>PCM</option><option>PCMB</option></select></label><label>Search name / institution / branch<input id="filterText" placeholder="Filter local records"></label><label>Status<select id="filterStatus"><option value="">All statuses</option><option value="active">In progress</option><option value="complete">Completed</option></select></label></div><div class="tablewrap"><table><thead><tr><th>Student</th><th>Institution / branch</th><th>Stream</th><th>Status</th><th>Action</th></tr></thead><tbody id="recordRows"></tbody></table></div><div class="note">Backups contain student information and responses. Share only with authorised people. Browser storage can be cleared or edited; use a central authenticated service before institutional rollout.</div>`);filterRows()}
function filterRows(){let stream=$('filterStream').value,term=$('filterText').value.toLowerCase(),status=$('filterStatus').value;let xs=records.filter(a=>(!stream||a.student.stream===stream)&&(!status||a.status===status)&&[a.student.name,a.student.institution,a.student.branch].join(' ').toLowerCase().includes(term));$('recordRows').innerHTML=xs.slice().reverse().map(a=>`<tr><td><b>${esc(a.student.name)}</b><br><small>${esc(a.student.studentId||'')}</small></td><td>${esc(a.student.institution)}<br><small>${esc(a.student.branch)}</small></td><td>${esc(a.student.stream)}</td><td>${a.status==='complete'?(a.result.reasons.length?'Incomplete evidence':'Completed'):(Date.now()>=a.deadline?'Time expired':'In progress')}</td><td><button data-action="${a.status==='complete'?'report':'resume'}" data-id="${esc(a.id)}">${a.status==='complete'?'View report':'Resume'}</button> <button data-action="delete" data-id="${esc(a.id)}">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No matching attempts. Start an assessment or restore a backup.</td></tr>'}
function download(name,obj){let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backup(one=false){let xs=one?records.filter(a=>a.id===reportId):records;download('MentorMe_Science_'+(one?'Record':'Backup')+'_'+new Date().toISOString().slice(0,10)+'.json',{format:'mentorme-science-backup',version:VERSION,exported:new Date().toISOString(),records:xs})}
async function restore(file){try{if(!file||file.size>20*1024*1024)throw Error('Choose a backup under 20 MB.');let b=JSON.parse(await file.text());if(b.format!=='mentorme-science-backup'||b.version!==VERSION||!Array.isArray(b.records)||b.records.length>2000||!b.records.every(validateRecord))throw Error('This is not a valid v2 backup. Open v1 backups in the earlier HTML; the new interest format requires a fresh v2 assessment.');let added=0;for(let a of b.records)if(!records.some(x=>x.id===a.id)){if(a.status==='complete'){a.result=score(a);a.modelVersion=VERSION}records.push(a);added++}persist();notice=added+' records restored. Existing IDs were kept unchanged. Imported results were recalculated with this pilot model.';dashboard()}catch(e){notice=e.message;dashboard()}}
function guide(){view='guide';stopTimer();shell(`<section class="panel narrow"><span class="eyebrow">IMPLEMENTATION NOTES</span><h1>What this version does</h1><p>A complete local assessment and reporting flow for three science streams. This v2 release uses a separate local record collection and does not overwrite v1 attempts. Open this HTML in a modern browser; no installation or payment is needed. Keep using the same browser and file location to access saved records. Export backups regularly.</p><h2>Included</h2><ul><li>90-question forms with shuffled questions and answer options.</li><li>Subject intake, instructions, timer, local autosave and resume.</li><li>Full-profile provisional scoring, response-coverage checks and reports.</li><li>60 career exploration profiles, five comparisons and three roadmaps.</li><li>Local facilitator dashboard, filters, JSON backup/restore and review notes.</li><li>Print styling for browser Print / Save PDF.</li></ul><h2>Before commercial deployment</h2><p>Commission independent question and scoring review. Expand and validate the bank. Maintain the explicit stream lists and add current, source-backed program eligibility records before making verified eligibility claims. Add central secure accounts, tenant isolation, guardian consent processes, server-side scoring and deadlines, auditable licences and backups.</p><p>All answer keys are visible in this file. There is no secure authentication, payment collection, cloud synchronisation or verified college catalogue. This version is for supervised demonstrations and pilots, not an institution-wide production service.</p><h2>Data handling</h2><p>No student data is transmitted by this HTML. Official source links open external sites only when clicked. Records and backups are editable local files; they are not tamper-proof. Clear records using Delete in the dashboard when no longer required.</p><h2>Assessment coverage</h2><p>${BANK.length} unique pilot items are included. Each stream has 180 eligible items. Each attempt selects 90 using fixed dimension quotas and provisional difficulty bands. Retakes can overlap, but content is no longer fixed. Scenarios use balanced exposure of all six interest areas. V1 backups use the old scoring format and must be opened in the earlier HTML; v2 starts a separate record collection.</p><button class="primary" data-action="intake">Start a pilot assessment</button></section>`)}
document.addEventListener('submit',e=>{if(e.target.id==='intakeForm')submitIntake(e)});
document.addEventListener('input',e=>{if(['filterText','filterStream','filterStatus'].includes(e.target.id))filterRows()});
document.addEventListener('change',e=>{if(e.target.id==='restoreFile')restore(e.target.files[0])});
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;let action=b.dataset.action,n=Number(b.dataset.value);switch(action){case'continue-intake':submitIntake(e);return;case'home':home();break;case'intake':intake();break;case'guide':guide();break;case'dashboard':dashboard();break;case'begin':begin();break;case'answer':if(active&&Date.now()>=active.deadline){finish(true);break}active.answers[active.questions[active.current].id]=n;persist();assessment();break;case'clear':delete active.answers[active.questions[active.current].id];persist();assessment();break;case'next':active.current=Math.min(89,active.current+1);persist();assessment();break;case'previous':active.current=Math.max(0,active.current-1);persist();assessment();break;case'jump':active.current=n;persist();assessment();break;case'backtest':assessment();break;case'review':review();break;case'submit':finish();break;case'resume':active=records.find(x=>x.id===b.dataset.id);assessment();break;case'report':report(b.dataset.id);break;case'print':window.print();break;case'backup':backup();break;case'exportone':backup(true);break;case'saveplan':saveReportPlan();break;case'savenote':{let a=records.find(x=>x.id===reportId);a.reviewNote=$('reviewNote').value;a.reviewedAt=Date.now();persist();report(reportId);break}case'delete':if(confirm('Delete this local attempt permanently? Export a backup first if needed.')){records=records.filter(x=>x.id!==b.dataset.id);persist();dashboard()}break;}if(!['answer','clear','jump','next','previous'].includes(action))window.scrollTo(0,0)});
window.addEventListener('storage',e=>{if(e.key===STORE){notice='Records changed in another tab. Refresh before starting or editing another attempt.';if(active){stopTimer();active=null}try{records=JSON.parse(e.newValue||'[]')}catch{}dashboard()}});
if(records.length && !records.every(validateRecord)){notice='Stored records are incompatible or damaged. Export a backup for recovery; do not rely on these results.';records=[];storageOK=false;}else{for(const a of records)if(a.status==='complete'){a.result=score(a);a.modelVersion=VERSION}}
home();
